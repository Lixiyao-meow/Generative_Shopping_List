[project]
name = "generative-shopping-list"
version = "0.1.0"
description = "Generate your shopping list from your chosen recipe"
readme = "README.md"
authors = [
    { name = "Kitty", email = "kitty@meow.fish" },
    { name = "peturparkur" },
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.2",

]

[project.scripts]
gen_shop = "generative_shopping_list.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generative_shopping_list"]
