name: Tests
on:
  pull_request:
  push:
    branches:
    - main
jobs:
  test-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: Install dependencies
      run: uv sync
  test-pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: Install dependencies
      run: uv sync
    - name: Run tests
      run: uv run pytest
